<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./static/styles/styles.css" />
    <title>Edit Page</title>
</head>

<body>
    <div id="wrapper">
        <header>
            <!-- Navigation -->
            <nav>
                <div>
                    <a href="#">Home</a>
                    <a href="#">Dashboard</a>
                    <a href="#">Report</a>
                </div>

                <!-- Logged-in users -->
                <div class="user">
                    <a href="#">Add Property</a>
                    <a href="#">Logout</a>
                </div>

                <!-- Guest users -->
                <div class="guest">
                    <a href="#">Login</a>
                    <a href="#">Register</a>
                </div>
            </nav>
        </header>

        <main class="edit">
            <!-- Edit Page (Only for logged-in users) -->
            <section id="edit">
                <div class="form">
                    <h2>Edit Property Info</h2>
                    <form class="edit-form">
                        <input type="text" id="type" placeholder="Type" />
                        <input type="text" id="location" placeholder="Location" />
                        <input type="number" id="area" placeholder="Area" />
                        <input type="text" id="image-url" placeholder="Image URL" />
                        <input type="number" id="price" placeholder="Price" />
                        <input type="number" id="contact" placeholder="For Contacts..." />
                        <textarea id="description" placeholder="Description..." name=""></textarea>
                        <button type="submit">Edit</button>
                    </form>

                </div>
            </section>
        </main>
    </div>
    <footer>SoftUni JS Back-End Exam 2025 &copy;</footer>
</body>

</html>
